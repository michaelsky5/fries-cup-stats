<!doctype html>
<html lang="zh-CN" data-booting>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赛事中心 | 薯条杯</title>
    <style>
      html[data-booting] { background: #f4f1e8; }
      html[data-booting] #root { visibility: hidden; }
      html[data-booting] #root *, html[data-booting] #root *::before, html[data-booting] #root *::after { animation-play-state: paused !important; }
      #app-boot { position: fixed; inset: 0; z-index: 100000; display: grid; place-content: center; gap: 18px; padding: 24px; background: #f4f1e8; color: #24221d; font-family: system-ui, sans-serif; }
      #app-boot .boot-brand { font-size: 12px; font-weight: 800; letter-spacing: .16em; }
      #app-boot strong { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
      #app-boot .boot-track { width: min(320px, calc(100vw - 48px)); height: 5px; background: #ddd9cf; overflow: hidden; }
      #app-boot .boot-track::after { content: ''; display: block; height: 100%; width: 38%; background: #f2c900; animation: boot-slide 1.2s ease-in-out infinite; }
      #app-boot p { margin: 0; max-width: 320px; font-size: 13px; line-height: 1.7; color: #676358; }
      #app-boot a { color: inherit; font-size: 14px; text-underline-offset: 4px; }
      #app-boot [hidden] { display: none; }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(265%); } }
      @media (prefers-reduced-motion: reduce) { #app-boot .boot-track::after { width: 100%; animation: none; } }
    </style>
  </head>
  <body>
    <div id="app-boot" role="status" aria-live="polite" aria-busy="true">
      <span class="boot-brand">FRIES CUP · EVENT CENTER</span>
      <strong id="app-boot-label">正在加载赛事中心</strong>
      <div class="boot-track" aria-hidden="true"></div>
      <p id="app-boot-hint">正在准备页面与界面资源…</p>
      <a id="app-boot-retry" href="" hidden>重新加载</a>
    </div>
    <noscript><style>#app-boot { display: none; }</style><p>请启用 JavaScript 后重新打开赛事中心。 / Please enable JavaScript to open the event center.</p></noscript>
    <div id="root" inert></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
