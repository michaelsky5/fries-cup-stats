<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Juno Martian helmet</title>
  <desc id="desc">Juno's tall transparent visor is held by a narrow crown and swept side equipment. One coral-tipped antenna, an offset ear shell and a curved lower rim distinguish her helmet without a filled face, boxy headphones or heavy collar.</desc>
