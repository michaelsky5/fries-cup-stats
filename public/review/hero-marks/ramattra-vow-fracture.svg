  <title id="title">Ramattra ceramic faceplate</title>
  <desc id="desc">Nine red optical nodes identify a ceramic faceplate seated in a continuous mechanical chassis. A flat dark brow joins the short temple mounts, and the face flows into a compact grey jaw.</desc>
