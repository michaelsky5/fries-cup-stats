    <path d="M-17 -20C-5 -32 14 -28 22 -16M27 4C24 20 10 30 -5 28" fill="none" stroke="#f0ab4e" stroke-width="1.2" stroke-linecap="round" opacity="0.52"/>
    <path d="M0 -13L10 0L0 13L-10 0Z" fill="url(#anchor)" stroke="#d9fbff" stroke-opacity="0.72" stroke-width="1.4"/>
    <path d="M0 -8V8M-5 0H5" stroke="#ffffff" stroke-width="0.8" opacity="0.36"/>
