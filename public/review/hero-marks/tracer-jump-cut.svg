<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Tracer jump-cut timeline</title>
  <desc id="desc">Tracer standalone emblem. Portrait motion is rendered in a separate background layer.</desc>
  <defs>
    <linearGradient id="cyan-line" x1="16" y1="132" x2="344" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58d7ef" stop-opacity="0"/>
      <stop offset="0.34" stop-color="#58d7ef" stop-opacity="0.5"/>
      <stop offset="0.68" stop-color="#a9f2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58d7ef" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="orange-line" x1="28" y1="172" x2="338" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e29a3c" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#e29a3c" stop-opacity="0.5"/>
      <stop offset="0.72" stop-color="#ffd395" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#e29a3c" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="anchor" cx="38%" cy="30%" r="74%">
      <stop offset="0" stop-color="#effdff"/>
      <stop offset="0.2" stop-color="#82e5f6"/>
