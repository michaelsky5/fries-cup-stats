    <g opacity="0.82" stroke-width="5.2"><use href="#leg-b"/><use href="#leg-b" transform="translate(360 0) scale(-1 1)"/></g>
    <g opacity="1" stroke-width="5.8"><use href="#leg-c"/><use href="#leg-c" transform="translate(360 0) scale(-1 1)"/></g>
    <g opacity="0.66" stroke-width="4.6"><use href="#leg-d"/><use href="#leg-d" transform="translate(360 0) scale(-1 1)"/></g>
  </g>
  <g fill="none" stroke="#f2a0b3" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.12" stroke-width="0.8"><use href="#leg-a"/><use href="#leg-a" transform="translate(360 0) scale(-1 1)"/></g>
