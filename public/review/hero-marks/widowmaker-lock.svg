<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Widowmaker black-widow crest</title>
  <desc id="desc">A restrained black-widow crest with an optical ring, jointed legs and a single hourglass highlight.</desc>
  <defs>
    <linearGradient id="leg" x1="28" y1="130" x2="176" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b1833" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#6d2246" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b83a62" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="body" x1="180" y1="72" x2="180" y2="218" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f3157"/>
      <stop offset="0.34" stop-color="#4a213f"/>
      <stop offset="1" stop-color="#130a17"/>
    </linearGradient>
    <linearGradient id="hourglass" x1="180" y1="145" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8399"/>
      <stop offset="0.52" stop-color="#ea4a6f"/>
      <stop offset="1" stop-color="#a61f49"/>
    </linearGradient>
    <filter id="soft-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
