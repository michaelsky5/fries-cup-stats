  <path d="M180 76C195 78 203 89 201 102C199 112 191 120 180 123C169 120 161 112 159 102C157 89 165 78 180 76Z" fill="url(#body)" stroke="#c64168" stroke-opacity="0.82" stroke-width="2"/>
