    <path d="M86 130C111 60 249 60 274 130"/>
    <path d="M106 130C127 88 233 88 254 130"/>
  </g>

  <g filter="url(#soft-glow)" fill="none" stroke="#c13b63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.11"><use href="#leg-a"/><use href="#leg-a" transform="translate(360 0) scale(-1 1)"/></g>
    <g opacity="0.17"><use href="#leg-b"/><use href="#leg-b" transform="translate(360 0) scale(-1 1)"/></g>
    <g opacity="0.22"><use href="#leg-c"/><use href="#leg-c" transform="translate(360 0) scale(-1 1)"/></g>
