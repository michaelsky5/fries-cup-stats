    <path id="leg-b" d="M157 101L119 84L76 68L35 76"/>
    <path id="leg-c" d="M157 111L116 122L72 146L32 158"/>
    <path id="leg-d" d="M163 119L132 151L98 191L65 218"/>
  </defs>

