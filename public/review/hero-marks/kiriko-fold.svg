<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Kiriko torii seal</title>
  <desc id="desc">A broad, lightly upswept roof rests on slender splayed pillars. The continuous lower beam leaves an open gateway and one uninterrupted gap above it, without a plaque, arrow or decorative grid.</desc>
