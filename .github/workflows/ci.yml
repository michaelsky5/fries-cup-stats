name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check account UI contracts
        run: npm run test:account-ui

      - name: Check lobby continuation, consent copy and language boundaries
        run: node --test scripts/teamLobby.test.mjs scripts/lobbyEntry.test.mjs scripts/passwordPolicy.test.mjs

      - name: Check weekly public pages and media
        run: npm run test:weekly-public-ui

      - name: Check public proxy revalidation and private cache boundaries
        run: npm run test:public-http-cache

      - name: Check readable weekly match identities and legacy links
        run: node --test scripts/assertWeeklyMatchIdentity.mjs

      - name: Check weekly newspaper and roster presentation
        run: npm run test:weekly-newspaper

      - name: Check roster previews and team identity
        run: npm run test:roster-display

      - name: Check mobile navigation state and account isolation
        run: npm run test:mobile-navigation

      - name: Check weekly roster scope and partial account sync
        run: node --test scripts/week2Community.test.mjs

      - name: Check weekly roster review presentation
        run: npm run test:weekly-roster-review

      - name: Check partner trial boundaries
        run: node scripts/assertPartnerTrial.mjs

      - name: Lint source files
        run: npm run lint

      - name: Check Overwatch Season 5 and historical roles
        run: node scripts/assertOverwatchSeason5.mjs

      - name: Check statistical rating and archived scoring rules
        run: npm run test:statistical-rating && npm run test:rating-release && node --test scripts/assertMatchReview.mjs

      - name: Check match data feedback and missing MVP explanations
        run: node --test scripts/matchFeedback.test.mjs scripts/historicalMatchMvp.test.mjs

      - name: Build production frontend
        run: npm run test:release-package && npm run build:release

      - name: Check public route loading budget
        run: node scripts/assertPublicBundle.mjs

      - name: Retain the matched frontend and EdgeOne function package
        uses: actions/upload-artifact@v4
        with:
          name: stats-production-release-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Build isolated partner trial frontend
        run: npm run build -- --outDir dist-trial
        env:
          VITE_PARTNER_TRIAL: "1"
          VITE_PARTNER_TRIAL_SEASONS: TRIALPARTNER26
          VITE_ADMIN_PUBLIC_PROXY_TARGET: https://test-admin.fries-cup.com
          VITE_PLATFORM_API_PROXY_TARGET: https://test-admin.fries-cup.com
